name: WSL release candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.10.4"
          cache: false
      - name: Prepare the release without activation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          prepared="$RUNNER_TEMP/akashic-prepared"
          origin="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git remote set-url origin "$origin"
          export MISE_TRUSTED_CONFIG_PATHS="$GITHUB_WORKSPACE:$prepared/runtime-sources/$GITHUB_SHA"
          mise exec -- python scripts/akashic_release/cli.py install --no-activate --yes \
            --source-checkout "$GITHUB_WORKSPACE" --origin "$origin" --commit "$GITHUB_SHA" \
            --root "$prepared" --runtime-env "$prepared/runtime.env" --mise "$(command -v mise)"
          mkdir "$RUNNER_TEMP/wsl-artifact"
          tar -C "$prepared" --dereference --hard-dereference -czf "$RUNNER_TEMP/wsl-artifact/bridge.tar.gz" \
            "bridge-venvs/$GITHUB_SHA" "releases/$GITHUB_SHA.json"
          docker save "akashic-core:${GITHUB_SHA:0:12}" | gzip -1 > "$RUNNER_TEMP/wsl-artifact/core.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wsl-release-${{ github.sha }}
          path: ${{ runner.temp }}/wsl-artifact
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
